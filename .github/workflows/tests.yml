name: tests

on:
  push:
    branches: [main, v2-multisetup]
  pull_request:

jobs:
  fast:
    # The unit half of the suite (~45 s). The Flower/Ray integration tests need a
    # GPU box and run before a sweep, not here.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Fast tests
        run: python -m pytest tests -q -p no:cacheprovider -k "not Fed and not fed and not integration"
